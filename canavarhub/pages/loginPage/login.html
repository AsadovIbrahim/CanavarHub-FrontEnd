<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CanavarHub | Daxil ol</title>
    <meta
      name="description"
      content="CanavarHub hesabına daxil ol və təlimlərinə davam et."
    />
    <link rel="stylesheet" href="../../style.css" />
    <link rel="stylesheet" href="./login.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card">
        <a href="../../index.html" class="login-logo"> CANAVAR<span>HUB</span> </a>

        <h1>Hesaba daxil ol</h1>
        <p>Öyrənməyə davam etmək üçün hesabına giriş et.</p>

        <form class="login-form">
          <label> Email </label>
          <input id="email" type="email" placeholder="email@example.com" />
          <span class="error-message"></span>

          <label> Şifrə </label>
          <input id="password" type="password" placeholder="********" />
          <span class="error-message"></span>

          <button type="submit" class="btn btn-primary">Daxil ol</button>
        </form>
        <a href="../../index.html" class="back-home-btn"> Ana səhifəyə qayıt </a>

        <div class="register-link">
          Hesabın yoxdur?
          <a href="../registerPage/register.html"> Qeydiyyatdan keç </a>
        </div>
      </section>
    </main>

    <script src="./login.js"></script>
  </body>
</html>
